packages:
  - "."
  - "apps/mobile"
  - "apps/table"
  - "packages/*"
  - "services/*"

allowBuilds:
  '@rootsdk/dev-tools': set this to true or false
  esbuild: true
  protobufjs: set this to true or false
  sqlite3: set this to true or false
  tesseract.js: true
  utf-8-validate: set this to true or false
  workerd: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
