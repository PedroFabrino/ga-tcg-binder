syntax = "proto3";

import "rootsdk/types.proto";

message StatusResponse {
  bool is_linked = 1;
  string collector_id = 2;
  string collector_name = 3;
  string friend_code = 4;
  bool notifications_enabled = 5;
  string deal_alert_mode = 6;
  string alert_channel_id = 7;
  bool is_admin = 8;
}

message LinkRequest {
  string code = 1;
}

message LinkResponse {
  bool success = 1;
  string collector_name = 2;
  string error = 3;
}

message RegisterResponse {
  bool success = 1;
  string collector_name = 2;
  string friend_code = 3;
  string error = 4;
}

message PreferencesRequest {
  bool notifications_enabled = 1;
  string deal_alert_mode = 2;
}

message PreferencesResponse {
  bool success = 1;
  bool notifications_enabled = 2;
  string deal_alert_mode = 3;
  string alert_channel_id = 4;
  string error = 5;
}

message DeckShortageCard {
  string card_slug = 1;
  string card_name = 2;
  int32 quantity = 3;
}

message DeckSummary {
  string id = 1;
  string name = 2;
  string champion = 3;
  string format = 4;
  int32 total_cards = 5;
  int32 hard_shortages_count = 6;
  int32 shared_shortages_count = 7;
  repeated DeckShortageCard hard_shortages = 8;
  repeated DeckShortageCard shared_shortages = 9;
  string omnidex_text = 10;
}

message DecksResponse {
  repeated DeckSummary decks = 1;
}

message AutocompleteChoiceItem {
  string name = 1;
  string value = 2;
  string element = 3;
  string type = 4;
  int32 quantity = 5;
  bool foil = 6;
}

message AutocompleteRpcRequest {
  string type = 1;
  string query = 2;
}

message AutocompleteRpcResponse {
  repeated AutocompleteChoiceItem results = 1;
}

message PersonalWantRpcItem {
  string card_slug = 1;
  string card_name = 2;
  string element = 3;
  string type = 4;
  int32 desired_quantity = 5;
  bool foil = 6;
}

message PersonalWantsRpcResponse {
  repeated PersonalWantRpcItem wants = 1;
}

message AddWantRpcRequest {
  string card = 1;
  int32 quantity = 2;
  bool foil = 3;
  string omnidex_url = 4;
  string omnidex_text = 5;
}

message AddWantRpcResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
  repeated AutocompleteChoiceItem suggestions = 4;
}

message RemoveWantRpcRequest {
  string card = 1;
  int32 quantity = 2;
}

message RemoveWantRpcResponse {
  bool success = 1;
  bool removed = 2;
  int32 remaining_quantity = 3;
  string card_name = 4;
  string error = 5;
  repeated AutocompleteChoiceItem suggestions = 6;
}

message ImportDeckRpcRequest {
  string url = 1;
  string text = 2;
}

message ImportDeckRpcResponse {
  bool success = 1;
  string deck_name = 2;
  string error = 3;
}

message UpdateDeckRpcRequest {
  string deck_id = 1;
  string url = 2;
  string text = 3;
  string name = 4;
  string champion = 5;
}

message UpdateDeckRpcResponse {
  bool success = 1;
  string deck_name = 2;
  string error = 3;
}

message CommunityChannelOption {
  string id = 1;
  string name = 2;
  string group_name = 3;
}

message AdminSettingsResponse {
  bool is_admin = 1;
  string broadcast_channel_id = 2;
  string broadcast_channel_name = 3;
  repeated CommunityChannelOption text_channels = 4;
}

message SetBroadcastChannelRequest {
  string channel_id = 1;
}

message SetBroadcastChannelResponse {
  bool success = 1;
  string broadcast_channel_id = 2;
  string broadcast_channel_name = 3;
  string error = 4;
}

message ProvisionMarketChannelsResponse {
  bool success = 1;
  string broadcast_channel_id = 2;
  string broadcast_channel_name = 3;
  string assistant_channel_id = 4;
  string error = 5;
}

service AssistantService {
  rpc GetStatus(rootsdk.Void) returns (StatusResponse);
  rpc LinkAccount(LinkRequest) returns (LinkResponse);
  rpc RegisterAccount(rootsdk.Void) returns (RegisterResponse);
  rpc SetPreferences(PreferencesRequest) returns (PreferencesResponse);
  rpc GetDecks(rootsdk.Void) returns (DecksResponse);
  rpc Autocomplete(AutocompleteRpcRequest) returns (AutocompleteRpcResponse);
  rpc GetPersonalWants(rootsdk.Void) returns (PersonalWantsRpcResponse);
  rpc AddWant(AddWantRpcRequest) returns (AddWantRpcResponse);
  rpc RemoveWant(RemoveWantRpcRequest) returns (RemoveWantRpcResponse);
  rpc ImportDeck(ImportDeckRpcRequest) returns (ImportDeckRpcResponse);
  rpc UpdateDeck(UpdateDeckRpcRequest) returns (UpdateDeckRpcResponse);
  rpc GetAdminSettings(rootsdk.Void) returns (AdminSettingsResponse);
  rpc SetBroadcastChannel(SetBroadcastChannelRequest) returns (SetBroadcastChannelResponse);
  rpc ProvisionMarketChannels(rootsdk.Void) returns (ProvisionMarketChannelsResponse);
}
