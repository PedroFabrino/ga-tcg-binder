name: Multi-Marketplace Catalog Sync

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      store_id:
        description: "Optional enabled market store ID to sync (e.g. 'myp' or 'brandao')"
        required: false
        type: string

jobs:
  market-sync:
    name: Sync Marketplace Listings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Start FlareSolverr Container
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          
          # Wait up to 60s for FlareSolverr to become ready
          for i in {1..30}; do
            if curl -s http://localhost:8191/ | grep -q "FlareSolverr"; then
              echo "FlareSolverr is ready!"
              break
            fi
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 2
          done

      - name: Run Market Sync Script
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FLARESOLVERR_URL: "http://localhost:8191"
          STORE_ID: ${{ inputs.store_id }}
        run: |
          if [ -n "$STORE_ID" ]; then
            pnpm tsx scripts/sync-market.ts --store "$STORE_ID"
          else
            pnpm tsx scripts/sync-market.ts
          fi

      - name: Stop FlareSolverr
        if: always()
        run: docker stop flaresolverr || true
