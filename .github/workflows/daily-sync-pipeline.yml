name: Daily Meta & Market Sync Pipeline

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  sync-pipeline:
    name: Run Unified Sync Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Start FlareSolverr Container
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          
          # Wait up to 60s for FlareSolverr to become ready
          for i in {1..30}; do
            if curl -s http://localhost:8191/ | grep -q "FlareSolverr"; then
              echo "FlareSolverr is ready!"
              break
            fi
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 2
          done

      - name: Run Unified Sync Pipeline
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FLARESOLVERR_URL: "http://localhost:8191"
        run: pnpm sync:pipeline

      - name: Stop FlareSolverr
        if: always()
        run: |
          docker stop flaresolverr || true
          docker rm flaresolverr || true
